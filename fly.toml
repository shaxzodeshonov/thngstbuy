# Fly.io - the paid alternative to the Vercel + Turso path in the README.
# `fly launch --no-deploy` will offer to rewrite this; decline, then create the
# volume and deploy.
#
# One machine only. The SQLite file lives on this instance's volume, so a second
# machine would serve a different database. Do not `fly scale count 2`.

app = "thngstbuy"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  DB_FILE = "/data/thngstbuy.db"
  # Fly's proxy is the single hop in front of the app.
  TRUST_PROXY = "1"

[[mounts]]
  source = "thngstbuy_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 180
    hard_limit = 240

[checks.health]
  type = "http"
  port = 8080
  path = "/api/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
