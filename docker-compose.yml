# Self-hosting on a VPS. Put a TLS terminator (Caddy, nginx, Cloudflare Tunnel)
# in front - list ids travel in the URL and must not cross the network in clear.
#
# This path keeps the database in a local SQLite file on the `data` volume.
# Back that volume up; nothing else is keeping the lists.

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      PORT: '8080'
      DB_FILE: /data/thngstbuy.db
      # Number of proxy hops in front of the app, for correct client IPs.
      TRUST_PROXY: '1'
    volumes:
      - data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s

volumes:
  data:
